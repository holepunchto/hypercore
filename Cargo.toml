[workspace]
resolver = "3"
exclude = ["vendor/hypercore"]
members = ["crates/shadw-core", "crates/university-db", "apps/university-demo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/SolutionsAsService/shadw-core"

[workspace.dependencies]
hypercore = { version = "=0.16.0", default-features = false, features = ["tokio", "sparse"] }
hypercore_schema = "=0.2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
fs2 = "0.4"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
shadw-core = { path = "crates/shadw-core" }
university-db = { path = "crates/university-db" }

# Bounded upstream persistence repairs; see vendor/hypercore/SHADW_PATCHES.md.
[patch.crates-io]
hypercore = { path = "vendor/hypercore" }
